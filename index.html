<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1e5f74">
<title>佐渡クエスト</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{
    --bg:#fbf6ea; --card:#ffffff; --ink:#2b2118; --sub:#6b5b4b;
    --line:#e3d8c4; --sea:#1e5f74; --gold:#d99b1c; --now:#d1471f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
    font-size:17px; line-height:1.7;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:760px;margin:0 auto;padding:0 14px 48px;}

  /* ---------- ヘッダー ---------- */
  header{
    background:linear-gradient(160deg,#1e5f74 0%,#144556 100%);
    color:#fff; padding:20px 14px 18px; text-align:center;
    border-bottom:5px solid var(--gold);
  }
  header .title{font-size:30px;font-weight:800;letter-spacing:.08em;margin:0;}
  header .sub{font-size:15px;opacity:.92;margin:4px 0 0;}
  .badge{
    display:inline-block;margin-top:10px;padding:5px 16px;border-radius:999px;
    background:var(--gold);color:#3a2600;font-weight:800;font-size:15px;
  }

  /* ---------- 共通カード ---------- */
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:16px;margin-top:16px;box-shadow:0 2px 8px rgba(80,60,30,.06);
  }
  h2{font-size:19px;margin:0 0 10px;display:flex;align-items:center;gap:8px;}
  h2 .mark{
    background:var(--sea);color:#fff;border-radius:8px;
    font-size:14px;padding:2px 9px;font-weight:700;
  }

  /* ---------- いまここ ---------- */
  #nowBar{
    margin-top:16px;background:#fff5e8;border:2px solid var(--now);
    border-radius:14px;padding:14px 16px;
  }
  #nowBar .lbl{font-weight:800;color:var(--now);font-size:15px;}
  #nowBar .place{font-size:22px;font-weight:800;margin-top:2px;word-break:break-word;}
  #nowBar .time{font-size:15px;color:var(--sub);margin-top:2px;}

  /* ---------- 地図 ---------- */
  #map{height:60vh;min-height:340px;border-radius:14px;border:1px solid var(--line);}
  .maphint{font-size:14px;color:var(--sub);margin-top:8px;}

  .pin{
    background:var(--sea);color:#fff;border:2px solid #fff;border-radius:50%;
    width:30px;height:30px;line-height:26px;text-align:center;
    font-weight:800;font-size:15px;box-shadow:0 2px 5px rgba(0,0,0,.35);
  }
  .pin.now{
    background:var(--now);width:40px;height:40px;line-height:36px;font-size:18px;
    border-width:3px;animation:beat 1.6s ease-in-out infinite;
  }
  @keyframes beat{0%,100%{transform:scale(1);}50%{transform:scale(1.14);}}
  .nowtag{
    background:var(--now);color:#fff;font-weight:800;font-size:13px;
    padding:2px 8px;border-radius:6px;white-space:nowrap;border:2px solid #fff;
    box-shadow:0 2px 5px rgba(0,0,0,.3);
  }
  .leaflet-popup-content{font-size:15px;line-height:1.6;margin:10px 12px;}
  .leaflet-popup-content img{width:100%;border-radius:8px;margin-bottom:6px;display:block;}

  /* ---------- 最新の1枚 ---------- */
  #latestPhoto img{width:100%;border-radius:12px;display:block;background:#eee;}
  .cmt{font-size:18px;margin:12px 0 0;white-space:pre-wrap;word-break:break-word;}
  .meta{font-size:15px;color:var(--sub);margin-top:6px;}

  /* ---------- 冒険ログ ---------- */
  .log{list-style:none;margin:0;padding:0;}
  .log li{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);}
  .log li:first-child{border-top:0;}
  .log .no{
    flex:0 0 32px;height:32px;border-radius:50%;background:var(--sea);color:#fff;
    font-weight:800;text-align:center;line-height:32px;font-size:15px;
  }
  .log li.is-now .no{background:var(--now);}
  .log .body{flex:1;min-width:0;}
  .log .pl{font-weight:700;font-size:17px;word-break:break-word;}
  .log .tx{font-size:16px;color:#3f342a;white-space:pre-wrap;word-break:break-word;}
  .log .tm{font-size:14px;color:var(--sub);}
  .log .th{flex:0 0 68px;}
  .log .th img{width:68px;height:68px;object-fit:cover;border-radius:10px;display:block;background:#eee;}

  /* ---------- 状態表示 ---------- */
  .state{text-align:center;padding:26px 12px;}
  .state .big{font-size:22px;font-weight:800;}
  .state .small{font-size:16px;color:var(--sub);margin-top:6px;}
  .err{background:#fdecea;border:2px solid #d1471f;color:#8b2a12;
       border-radius:14px;padding:16px;margin-top:16px;font-size:16px;}
  #newBanner{
    position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:9999;
    background:var(--now);color:#fff;border:0;border-radius:999px;
    padding:14px 24px;min-height:48px;font-size:17px;font-weight:800;
    box-shadow:0 6px 18px rgba(0,0,0,.3);cursor:pointer;display:none;
  }
  footer{text-align:center;font-size:14px;color:var(--sub);margin-top:22px;line-height:1.9;}
</style>
</head>
<body>

<header>
  <p class="title" id="hTitle">佐渡クエスト</p>
  <p class="sub" id="hSub">父と息子の佐渡島冒険記</p>
  <span class="badge" id="hBadge">ただいま冒険中！</span>
</header>

<div class="wrap">

  <div id="errBox" class="err" style="display:none"></div>

  <div id="loading" class="state">
    <div class="big">読み込んでいます…</div>
    <div class="small">少しお待ちください</div>
  </div>

  <div id="main" style="display:none">

    <div id="nowBar">
      <div class="lbl">いまここ</div>
      <div class="place" id="nowPlace">—</div>
      <div class="time" id="nowTime"></div>
    </div>

    <div class="card">
      <h2><span class="mark">地図</span>佐渡島のどこにいる？</h2>
      <div id="map"></div>
      <p class="maphint">赤い大きな丸が「いまここ」です。数字は立ち寄った順番、線は回った道すじです。丸をタップすると写真が出ます。</p>
    </div>

    <div class="card" id="latestCard">
      <h2><span class="mark">最新</span>いちばん新しい1枚</h2>
      <div id="latestPhoto"></div>
      <p class="cmt" id="latestCmt"></p>
      <p class="meta" id="latestMeta"></p>
    </div>

    <div class="card">
      <h2><span class="mark">記録</span>冒険ログ</h2>
      <ul class="log" id="logList"></ul>
    </div>

    <div id="empty" class="card state" style="display:none">
      <div class="big">佐渡クエスト、まもなく出発！</div>
      <div class="small">最初の写真がとどくまで、もう少しお待ちください。</div>
    </div>

  </div>

  <footer>
    現在地は、最後に写真を投稿した場所です。<br>
    最終更新：<span id="updatedAt">—</span>
  </footer>
</div>

<button id="newBanner">新しい投稿があります　タップして更新</button>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="config.js"></script>
<script>
(function(){
  'use strict';

  var CFG = window.SADO_CONFIG || {
    SUPABASE_URL: 'https://ewpqucrsvgicqlmbotvo.supabase.co',
    SUPABASE_KEY: 'sb_publishable_GN2YwmobTQt6dpeccWFLLw__4X-biBJ'
  };

  // 共有URLの合言葉。URL の ?t=... だけから受け取ります。
  // （このファイル自体には合言葉を書きません。書くと、URLを知らない人にも見えてしまうため）
  var params = new URLSearchParams(location.search);
  var token  = params.get('t') || '';

  var SADO_CENTER = [38.0500, 138.3800];

  var $ = function(id){ return document.getElementById(id); };
  var map, layerPins, layerLine, trip = null, posts = [], lastCount = -1, firstDraw = true;

  // ---------- 表示ユーティリティ ----------
  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function jtime(iso){
    if(!iso) return '';
    var d = new Date(iso);
    if(isNaN(d)) return '';
    return d.toLocaleString('ja-JP', {
      timeZone:'Asia/Tokyo', month:'numeric', day:'numeric',
      hour:'2-digit', minute:'2-digit'
    }) + '　（日本時間）';
  }
  function jtimeShort(iso){
    if(!iso) return '';
    var d = new Date(iso);
    if(isNaN(d)) return '';
    return d.toLocaleString('ja-JP', {
      timeZone:'Asia/Tokyo', month:'numeric', day:'numeric',
      hour:'2-digit', minute:'2-digit'
    });
  }
  function showError(msg){
    var b = $('errBox');
    b.innerHTML = msg;
    b.style.display = 'block';
    $('loading').style.display = 'none';
  }

  // ---------- 通信 ----------
  // 合言葉（token）を渡した人にだけ結果を返す専用の窓口を呼びます。
  // 合言葉が違えば、サーバー側で「空っぽ」が返るだけで、中身は一切出ません。
  function rpc(name, args){
    return fetch(CFG.SUPABASE_URL + '/rest/v1/rpc/' + name, {
      method: 'POST',
      headers: {
        apikey: CFG.SUPABASE_KEY,
        Authorization: 'Bearer ' + CFG.SUPABASE_KEY,
        'Content-Type': 'application/json'
      },
      cache: 'no-store',
      body: JSON.stringify(args)
    }).then(function(r){
      if(!r.ok) throw new Error('サーバーから ' + r.status + ' が返りました');
      return r.json();
    });
  }

  // ---------- 地図 ----------
  function initMap(){
    map = L.map('map', { zoomControl:true, scrollWheelZoom:true })
           .setView(SADO_CENTER, 10);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);
    layerLine = L.layerGroup().addTo(map);
    layerPins = L.layerGroup().addTo(map);
  }

  function drawMap(){
    layerPins.clearLayers();
    layerLine.clearLayers();
    if(!posts.length) return;

    var pts = posts.map(function(p){ return [Number(p.latitude), Number(p.longitude)]; });

    if(pts.length > 1){
      L.polyline(pts, {
        color:'#1e5f74', weight:4, opacity:.85, dashArray:'10 8', lineCap:'round'
      }).addTo(layerLine);
    }

    posts.forEach(function(p, i){
      var isNow = (i === posts.length - 1);
      var ll = [Number(p.latitude), Number(p.longitude)];
      var icon = L.divIcon({
        className:'',
        html:'<div class="pin' + (isNow ? ' now' : '') + '">' + (i + 1) + '</div>',
        iconSize: isNow ? [40,40] : [30,30],
        iconAnchor: isNow ? [20,20] : [15,15]
      });
      var m = L.marker(ll, { icon: icon, zIndexOffset: isNow ? 1000 : 0 }).addTo(layerPins);

      var html = '';
      if(p.thumbnail_url || p.image_url){
        html += '<img src="' + esc(p.thumbnail_url || p.image_url) + '" alt="">';
      }
      html += '<b>' + (i + 1) + '. ' + esc(p.place_name || '名もなき地点') + '</b>';
      if(p.comment) html += '<br>' + esc(p.comment);
      html += '<br><span style="color:#6b5b4b">' + esc(jtimeShort(p.posted_at)) + '</span>';
      m.bindPopup(html, { maxWidth: 260 });

      if(isNow){
        L.marker(ll, {
          icon: L.divIcon({ className:'', html:'<div class="nowtag">いまここ</div>',
                            iconSize:[76,24], iconAnchor:[38,42] }),
          interactive:false, zIndexOffset:1100
        }).addTo(layerPins);
      }
    });

    if(firstDraw){
      if(pts.length === 1){
        map.setView(pts[0], 12);
      } else {
        map.fitBounds(L.latLngBounds(pts).pad(0.25));
      }
      firstDraw = false;
    }
  }

  // ---------- 画面描画 ----------
  function render(){
    $('loading').style.display = 'none';
    $('main').style.display = 'block';

    if(trip){
      $('hTitle').textContent = trip.title || '佐渡クエスト';
      $('hSub').textContent   = trip.subtitle || '';
      $('hBadge').textContent =
        trip.status === 'completed' ? '冒険はぶじ終了！' :
        trip.status === 'planned'   ? 'まもなく出発！'   : 'ただいま冒険中！';
    }

    if(!map) initMap();

    var has = posts.length > 0;
    $('nowBar').style.display     = has ? 'block' : 'none';
    $('latestCard').style.display = has ? 'block' : 'none';
    $('empty').style.display      = has ? 'none'  : 'block';

    drawMap();

    if(has){
      var last = posts[posts.length - 1];
      $('nowPlace').textContent = last.place_name || '佐渡島のどこか';
      $('nowTime').textContent  = jtime(last.posted_at);

      $('latestPhoto').innerHTML =
        '<img src="' + esc(last.image_url) + '" alt="最新の写真" loading="eager">';
      $('latestCmt').textContent  = last.comment || '';
      $('latestMeta').textContent =
        (posts.length) + '番目の投稿　/　' +
        (last.place_name || '佐渡島のどこか') + '　/　' + jtime(last.posted_at);

      var items = posts.slice().reverse().map(function(p, idx){
        var no = posts.length - idx;
        var isNow = (idx === 0);
        var th = p.thumbnail_url || p.image_url;
        return '<li class="' + (isNow ? 'is-now' : '') + '">' +
                 '<div class="no">' + no + '</div>' +
                 (th ? '<div class="th"><img src="' + esc(th) + '" alt="" loading="lazy"></div>' : '') +
                 '<div class="body">' +
                   '<div class="pl">' + esc(p.place_name || '名もなき地点') +
                     (isNow ? '　<span style="color:#d1471f">← いまここ</span>' : '') + '</div>' +
                   (p.comment ? '<div class="tx">' + esc(p.comment) + '</div>' : '') +
                   '<div class="tm">' + esc(jtimeShort(p.posted_at)) + '</div>' +
                 '</div>' +
               '</li>';
      }).join('');
      $('logList').innerHTML = items;
    }

    $('updatedAt').textContent = new Date().toLocaleString('ja-JP', {
      timeZone:'Asia/Tokyo', hour:'2-digit', minute:'2-digit'
    });
    $('newBanner').style.display = 'none';
    lastCount = posts.length;
  }

  // ---------- 読み込み ----------
  function load(){
    if(!token) return Promise.reject(new Error('__BADTOKEN__'));
    return rpc('get_trip', { p_token: token })
      .then(function(rows){
        if(!rows || !rows.length){
          throw new Error('__BADTOKEN__');
        }
        trip = rows[0];
        return rpc('get_posts', { p_token: token });
      })
      .then(function(rows){
        posts = rows || [];
        render();
      });
  }

  function checkNew(){
    if(!trip || !token) return;
    rpc('get_posts', { p_token: token })
      .then(function(rows){
        if(rows && rows.length !== lastCount){
          $('newBanner').style.display = 'block';
        }
      })
      .catch(function(){ /* 通信が不安定なときは黙って次回に回す */ });
  }

  $('newBanner').addEventListener('click', function(){
    $('newBanner').style.display = 'none';
    load().catch(function(){});
  });

  load().catch(function(e){
    if(e && e.message === '__BADTOKEN__'){
      showError('<b>このURLでは冒険の記録を開けませんでした。</b><br>' +
                'お手元のリンクをもう一度タップしてみてください。' +
                'それでも開かないときは、送ってくれた人にリンクを聞き直してください。');
    } else {
      showError('<b>読み込みに失敗しました。</b><br>' +
                'インターネットにつながっているか確認して、画面を下に引っぱって更新してください。<br>' +
                '<span style="font-size:14px">（詳細：' + esc(e && e.message) + '）</span>');
    }
  });

  setInterval(checkNew, 30000);
  document.addEventListener('visibilitychange', function(){
    if(!document.hidden) checkNew();
  });
})();
</script>
</body>
</html>
